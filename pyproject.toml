[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "myfund-mcp"
version = "0.1.0"
description = "MCP server for myFund.pl investment portfolio data"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.0.0",
    "httpx>=0.27.0",
]

[project.scripts]
myfund-mcp = "src.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
